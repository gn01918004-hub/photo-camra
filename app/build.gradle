plugins {
    id "com.android.application"
}

android {
    namespace "com.worklog.pointcam"
    compileSdk 34

    defaultConfig {
        applicationId "com.worklog.pointcam"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 固定的簽章金鑰：每次編譯出的新版都能直接覆蓋安裝舊版（設定與紀錄會保留）
    signingConfigs {
        app {
            storeFile file("pointcam.keystore")
            storePassword "pointcam"
            keyAlias "pointcam"
            keyPassword "pointcam"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.app
        }
        debug {
            signingConfig signingConfigs.app
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
