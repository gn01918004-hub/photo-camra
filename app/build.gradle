plugins {
    id "com.android.application"
}

android {
    namespace "com.worklog.pointcam"
    compileSdk 34

    defaultConfig {
        applicationId "com.worklog.pointcam"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 方便直接安裝：release 版也用 debug 金鑰簽署
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
