name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # ubuntu-24.04 映像檔已內建 Android SDK
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: 回報編譯錯誤
        if: failure()
        run: |
          grep -E "error:|ERROR|FAILED|What went wrong" -A3 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
      - uses: actions/upload-artifact@v5
        with:
          name: PointCam-apk
          path: app/build/outputs/apk/release/*.apk
      - name: 發佈到 Releases（手機可直接下載）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk PointCam.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" PointCam.apk --title "點號拍照 #${{ github.run_number }}" --notes "下載 PointCam.apk 到手機安裝。" --latest
